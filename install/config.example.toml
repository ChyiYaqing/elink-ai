[agent]
# Mac running ElinkAIBridge. This can also be changed from the menu bar.
bridge_url = "http://192.168.1.20:8765"
listen_host = "0.0.0.0"
listen_port = 8766
poll_interval_s = 2.0
request_timeout_s = 3.0
stale_after_s = 90

[display]
# Use "mock" during development or "waveshare_5in83_v2" on the Raspberry Pi.
driver = "waveshare_5in83_v2"
output_path = "/var/lib/elink-ai/last-frame.png"
state_path = "/var/lib/elink-ai/state.json"
font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
orientation = 0

[refresh]
min_interval_s = 30
coalesce_s = 2
full_every = 20
full_interval_s = 21600

[monitor]
# When AI usage is idle for `idle_after_s`, the panel flips to a device-monitor
# page (CPU load, memory, disk, temperature, network, panel health). AI activity
# (a working session or a permission request) flips it back to the AI dashboard.
# With a single e-paper you get a live panel during quiet hours, not a frozen
# dashboard. Set enabled = false to keep the dashboard always on screen.
enabled = false
idle_after_s = 300
# 翻到监控页后的最短驻留时间。没有它，断续的 AI 活动会让面板在两个版面之间来回
# 抖，而每次切换都是一次整屏刷新（5.83" 面板上约 3.6 秒）。待审批可以立刻打断。
min_dwell_s = 300
# How often the monitor page re-renders. Bounded below by `min_interval_s`;
# the frame differ skips it when nothing actually changed.
refresh_interval_s = 60
# Sampling window used to derive network throughput from /proc/net/dev.
net_sample_interval_s = 5
