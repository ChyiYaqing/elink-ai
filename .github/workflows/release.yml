name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test-python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_metadata.py \
            --release-version "${GITHUB_REF_NAME#v}" \
            --check-prev-release \
            --github-repo "${{ github.repository }}" \
            --check-changelog \
            --check-readme

      - name: Test Python packages
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q

  test-tui:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elink-tui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            elink-tui/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('elink-tui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test Rust TUI
        run: cargo test --locked

  build:
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, elink-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: arm64-apple-macosx13.0
          - arch: x86_64
            triple: x86_64-apple-macosx13.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test macOS app
        run: swift test
        working-directory: mac-app

      - name: Build ${{ matrix.arch }} binary
        run: |
          SCRATCH="$RUNNER_TEMP/swift-release-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -rf "$SCRATCH"' EXIT
          swift build -c release \
            --triple "${{ matrix.triple }}" \
            --scratch-path "$SCRATCH"
          BIN_DIR=$(swift build -c release \
            --triple "${{ matrix.triple }}" \
            --scratch-path "$SCRATCH" \
            --show-bin-path)
          BINARY="$RUNNER_TEMP/ElinkAIBridge-${{ matrix.arch }}"
          cp "$BIN_DIR/ElinkAIBridge" "$BINARY"
          lipo "$BINARY" -verify_arch "${{ matrix.arch }}"
        working-directory: mac-app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ElinkAIBridge-${{ matrix.arch }}
          path: ${{ runner.temp }}/ElinkAIBridge-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build-tui:
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, elink-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            file_pattern: "aarch64|arm64"
          - arch: amd64
            platform: linux/amd64
            file_pattern: "x86-64|x86_64|amd64"
    env:
      RUST_IMAGE: rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify TUI version
        run: |
          /opt/homebrew/bin/python3.13 .github/scripts/check_metadata.py \
            --release-version "${GITHUB_REF_NAME#v}"

      - name: Build Linux ${{ matrix.arch }} TUI
        run: |
          OUTPUT="$RUNNER_TEMP/elink-tui-linux-${{ matrix.arch }}"
          mkdir -p "$OUTPUT"
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/tmp/cargo-home \
            --env CARGO_TARGET_DIR=/tmp/target \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$OUTPUT:/output" \
            --workdir /workspace/elink-tui \
            "$RUST_IMAGE" \
            bash -euc '
              cargo build --release --locked
              strip "$CARGO_TARGET_DIR/release/elink-tui"
              cp "$CARGO_TARGET_DIR/release/elink-tui" /output/elink-tui
            '
          chmod 0755 "$OUTPUT/elink-tui"
          FILE_OUTPUT=$(file "$OUTPUT/elink-tui")
          echo "$FILE_OUTPUT"
          echo "$FILE_OUTPUT" | grep -Eqi '${{ matrix.file_pattern }}'
          tar -C "$OUTPUT" -czf \
            "$RUNNER_TEMP/elink-tui-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" \
            elink-tui

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elink-tui-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/elink-tui-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [test-python, test-tui, build, build-tui]
    permissions:
      actions: read
      contents: write
    runs-on: [self-hosted, macOS, ARM64, elink-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ElinkAIBridge-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: elink-tui-linux-*
          path: ${{ runner.temp }}/tui
          merge-multiple: true

      - name: Create Universal Binary
        run: |
          ARM64="$RUNNER_TEMP/binaries/ElinkAIBridge-arm64"
          X86_64="$RUNNER_TEMP/binaries/ElinkAIBridge-x86_64"
          UNIVERSAL="$RUNNER_TEMP/ElinkAIBridge"
          chmod 0755 "$ARM64" "$X86_64"
          lipo -create "$ARM64" "$X86_64" -output "$UNIVERSAL"
          # Xcode 27 的 lipo 把 -verify_arch 之后多出来的架构当成输入文件，逐个检查
          lipo "$UNIVERSAL" -verify_arch arm64
          lipo "$UNIVERSAL" -verify_arch x86_64
          file "$UNIVERSAL"

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $VERSION does not match app version $APP_VERSION" >&2
            exit 1
          fi
          ELINK_BINARY="$RUNNER_TEMP/ElinkAIBridge" \
            RELEASE_VERSION="$VERSION" \
            sh build-dmg.sh
        working-directory: mac-app

      - name: Package agent
        run: |
          /opt/homebrew/bin/python3.13 .github/scripts/check_metadata.py \
            --release-version "${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz -o "$RUNNER_TEMP/elink-agent-${GITHUB_REF_NAME}.tar.gz" \
            HEAD pyproject.toml elink-agent

      # 软件更新签名：App 和设备只安装与内置公钥匹配的包。私钥只经环境变量传给脚本。
      - name: Sign update archive
        env:
          ELINK_UPDATE_SIGNING_KEY: ${{ secrets.ELINK_UPDATE_SIGNING_KEY }}
        run: |
          ZIP=".build/elink-ai-${GITHUB_REF_NAME}.zip"
          # 已安装的客户端信任的公钥；轮换密钥的过渡版本里它与 Info.plist 中的新公钥不同。
          PUBLIC_KEY=$(tr -d '[:space:]' < update-signing-public-key)
          AGENT="$RUNNER_TEMP/elink-agent-${GITHUB_REF_NAME}.tar.gz"
          swift scripts/sign-update.swift "$ZIP" "$PUBLIC_KEY" > "$ZIP.sig"
          swift scripts/sign-update.swift "$AGENT" "$PUBLIC_KEY" > "$AGENT.sig"
        working-directory: mac-app

      - name: Prepare release notes
        run: |
          /opt/homebrew/bin/python3.13 .github/scripts/check_metadata.py \
            --release-version "${GITHUB_REF_NAME#v}" \
            --check-changelog \
            --write-release-notes "$RUNNER_TEMP/release-notes.md"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH=/opt/homebrew/bin/gh
          if [ ! -x "$GH" ]; then
            echo "GitHub CLI not found at $GH" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="mac-app/.build/elink-ai-${GITHUB_REF_NAME}.dmg"
          ZIP="mac-app/.build/elink-ai-${GITHUB_REF_NAME}.zip"
          AGENT="$RUNNER_TEMP/elink-agent-${GITHUB_REF_NAME}.tar.gz"
          ASSETS=("$DMG" "$ZIP" "$ZIP.sig" "$AGENT" "$AGENT.sig" "$RUNNER_TEMP"/tui/*.tar.gz)
          NOTES="$RUNNER_TEMP/release-notes.md"
          TITLE="elink-ai Version $VERSION"
          IS_PRERELEASE=false
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if "$GH" release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            "$GH" release edit "$GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              --title "$TITLE" \
              --prerelease="$IS_PRERELEASE"
            "$GH" release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            "$GH" release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --notes-file "$NOTES" \
              --title "$TITLE" \
              "${PRERELEASE_ARGS[@]}"
          fi
