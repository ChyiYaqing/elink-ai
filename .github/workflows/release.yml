name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, elink-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: arm64-apple-macosx13.0
          - arch: x86_64
            triple: x86_64-apple-macosx13.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test macOS app
        run: swift test
        working-directory: mac-app

      - name: Build ${{ matrix.arch }} binary
        run: |
          SCRATCH="$RUNNER_TEMP/swift-release-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -rf "$SCRATCH"' EXIT
          swift build -c release \
            --triple "${{ matrix.triple }}" \
            --scratch-path "$SCRATCH"
          BIN_DIR=$(swift build -c release \
            --triple "${{ matrix.triple }}" \
            --scratch-path "$SCRATCH" \
            --show-bin-path)
          BINARY="$RUNNER_TEMP/ElinkAIBridge-${{ matrix.arch }}"
          cp "$BIN_DIR/ElinkAIBridge" "$BINARY"
          lipo "$BINARY" -verify_arch "${{ matrix.arch }}"
        working-directory: mac-app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ElinkAIBridge-${{ matrix.arch }}
          path: ${{ runner.temp }}/ElinkAIBridge-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    permissions:
      actions: read
      contents: write
    runs-on: [self-hosted, macOS, ARM64, elink-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ElinkAIBridge-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true

      - name: Create Universal Binary
        run: |
          ARM64="$RUNNER_TEMP/binaries/ElinkAIBridge-arm64"
          X86_64="$RUNNER_TEMP/binaries/ElinkAIBridge-x86_64"
          UNIVERSAL="$RUNNER_TEMP/ElinkAIBridge"
          chmod 0755 "$ARM64" "$X86_64"
          lipo -create "$ARM64" "$X86_64" -output "$UNIVERSAL"
          lipo "$UNIVERSAL" -verify_arch arm64 x86_64
          file "$UNIVERSAL"

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $VERSION does not match app version $APP_VERSION" >&2
            exit 1
          fi
          ELINK_BINARY="$RUNNER_TEMP/ElinkAIBridge" \
            RELEASE_VERSION="$VERSION" \
            sh build-dmg.sh
        working-directory: mac-app

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if ! awk -v version="$VERSION" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "$NOTES"; then
            echo "CHANGELOG.md has no ## $VERSION section" >&2
            exit 1
          fi
          if ! grep -Eq '^### (Packaging|Added|Changed|Fixed|Removed)$' "$NOTES" || \
             ! grep -q '^- ' "$NOTES"; then
            echo "CHANGELOG.md has no categorized release notes for $VERSION" >&2
            exit 1
          fi

      - name: Publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GH=/opt/homebrew/bin/gh
          if [ ! -x "$GH" ]; then
            echo "GitHub CLI not found at $GH" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="mac-app/.build/elink-ai-${GITHUB_REF_NAME}.dmg"
          NOTES="$RUNNER_TEMP/release-notes.md"
          TITLE="elink-ai Version $VERSION"
          IS_PRERELEASE=false
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if "$GH" release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            "$GH" release edit "$GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              --title "$TITLE" \
              --prerelease="$IS_PRERELEASE"
            "$GH" release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          else
            "$GH" release create "$GITHUB_REF_NAME" "$DMG" \
              --verify-tag \
              --notes-file "$NOTES" \
              --title "$TITLE" \
              "${PRERELEASE_ARGS[@]}"
          fi
